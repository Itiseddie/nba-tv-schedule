<!doctype html>
<html lang="en">

<meta name="apple-mobile-web-app-title" content="NBA Finder">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

<title>NBA Game Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: day picker on top, then one banner and a grid of game cards for the chosen day.
   Type: Atkinson Hyperlegible (designed for low vision). Text size is a single scale on <html>. */
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --ink: #101828;
  --muted: #475467;
  --line: #C4CCD8;
  --edge: #1D2939;
  --ytv: #B1141F;
  --lp: #14367A;
  --pk: #1B1B22;
  --on-service: #FFFFFF;
  --live: #0A6B36;
  --on-live: #FFFFFF;
  --live-bg: #DDF5E6;
  --focus: #1D4ED8;
  --scale: 1.2;
  --font-display: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1118; --surface: #161D27; --ink: #F4F6F9; --muted: #B4BECC; --line: #35424F; --edge: #9AA6B6;
    --pk: #000000;
    --ytv: #D92D3A; --lp: #3B68CC; --on-service: #FFFFFF;
    --live: #5BE08F; --on-live: #06210F; --live-bg: #12301F; --focus: #7AA2FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1118; --surface: #161D27; --ink: #F4F6F9; --muted: #B4BECC; --line: #35424F; --edge: #9AA6B6;
  --pk: #000000;
  --ytv: #D92D3A; --lp: #3B68CC; --on-service: #FFFFFF;
  --live: #5BE08F; --on-live: #06210F; --live-bg: #12301F; --focus: #7AA2FF;
  color-scheme: dark;
}
html { font-size: calc(16px * var(--scale)); }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.35;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 1rem 3rem;
}
/* Width is capped so the grid tops out at 3 columns. Each column needs about 13rem, so bigger text means fewer columns. */
.wrap { width: 100%; max-width: 52rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); gap: 0.9rem; }
.cards > .game { min-width: 0; }
a, button, summary { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 0.2rem solid var(--focus); outline-offset: 0.2rem; }

.top { display: flex; flex-direction: column; gap: 1rem; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1.1; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 0.85rem; margin: 0.25rem 0 0; }
.size { display: flex; align-items: center; gap: 0.5rem; }
.size span { font-size: 0.8rem; color: var(--muted); }
.size button {
  font: 700 1.1rem var(--font-display); min-width: 3rem; min-height: 3rem; border-radius: 0.6rem;
  background: var(--surface); color: var(--ink); border: 0.15rem solid var(--ink); cursor: pointer;
}
.size button:disabled { opacity: 0.35; cursor: default; }

/* Day picker */
.days { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 5.6rem), 1fr)); gap: 0.5rem; }
.days button {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.1rem; min-height: 4.6rem; padding: 0.4rem 0.3rem;
  background: var(--surface); color: var(--ink); border: 0.2rem solid var(--edge); border-radius: 0.7rem; cursor: pointer; font-family: var(--font-display);
}
.days button .w { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.days button .d { font-size: 1.35rem; font-weight: 800; line-height: 1.05; white-space: nowrap; }
.days button .c { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.days button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.days button[aria-pressed="true"] .c { color: var(--bg); }

.day { display: flex; flex-direction: column; gap: 0.9rem; }
.day + .day { margin-top: 1.25rem; padding-top: 1.75rem; border-top: 0.5rem solid var(--ink); }
.day h2 {
  display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; column-gap: 1rem; row-gap: 0.1rem;
  background: var(--ink); color: var(--bg); border-radius: 0.7rem; padding: 0.75rem 1rem; margin: 0;
  font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1.1;
}
.day h2 .dt { font-size: 0.95rem; font-weight: 600; }
.day.livesec { padding-bottom: 0.5rem; }
.day.livesec h2 { background: var(--live); color: var(--on-live); }
.day h3 {
  background: var(--lp); color: var(--on-service); border-radius: 0.7rem; padding: 0.7rem 1rem; margin: 0.6rem 0 0;
  font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; line-height: 1.15;
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; column-gap: 1rem;
}
.day h3 span { font-size: 0.9rem; font-weight: 600; }
.partial { margin: 0; padding: 0.7rem 1rem; border: 0.15rem dashed var(--edge); border-radius: 0.7rem; color: var(--muted); font-size: 0.9rem; }

.game {
  background: var(--surface); border: 0.2rem solid var(--edge); border-radius: 0.9rem;
  display: flex; flex-direction: column; overflow: hidden; height: 100%;
}
.game.live { border-color: var(--live); border-width: 0.25rem; }
.game.done { opacity: 0.9; }
.tm .pts { margin-left: auto; font: 800 2.4rem/1 var(--font-display); font-style: normal; font-variant-numeric: tabular-nums; color: var(--muted); }
.tm .pts.win { color: var(--ink); }
.head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap; padding: 0.85rem 1rem 0; }
.time { font: 800 1.5rem var(--font-display); font-variant-numeric: tabular-nums; }
.pill { font: 800 0.85rem var(--font-display); letter-spacing: 0.04em; text-transform: uppercase; padding: 0.3rem 0.65rem; border-radius: 99rem; border: 0.12rem solid var(--line); color: var(--muted); }
.pill.live { background: var(--live-bg); color: var(--live); border-color: var(--live); }
.teams { display: flex; flex-direction: column; padding: 0.4rem 1rem 0.9rem; }
.tm { display: flex; align-items: center; gap: 0.8rem; min-width: 0; }
.tm b { font: 800 1.6rem/1.1 var(--font-display); text-wrap: balance; min-width: 0; }
.tm i {
  flex: none; display: grid; place-items: center; width: 3.6rem; height: 3.6rem; border-radius: 50%; font-style: normal;
  font: 800 1.1rem var(--font-display); letter-spacing: 0.02em; color: #FFFFFF; border: 0.18rem solid var(--edge);
}
.tm i.logo { width: 4rem; height: 4rem; border-radius: 0.8rem; background: #FFFFFF; padding: 0.3rem; }
.tm i.logo img { display: block; width: 100%; height: 100%; object-fit: contain; }
.teams .at { font-size: 0.95rem; color: var(--muted); padding: 0.35rem 0 0.35rem 1.4rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }

.watch { margin-top: auto; padding: 0.9rem 1rem 1rem; color: var(--on-service); display: flex; flex-direction: column; gap: 0.2rem; }
.watch.ytv { background: var(--ytv); }
.watch.lp { background: var(--lp); }
.watch.pk { background: var(--pk); }
.watch.hy { background: linear-gradient(100deg, var(--ytv) 0 50%, var(--pk) 50% 100%); }
.watch .warn { align-self: flex-start; background: #FFD84D; color: #111111; border-radius: 0.5rem; padding: 0.3rem 0.7rem; margin-top: 0.4rem; font: 800 1.15rem/1.15 var(--font-display); }
.watch .lbl { font: 700 0.8rem var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.95; }
.watch .svc { font: 800 1.6rem/1.05 var(--font-display); }
.watch .chan { background: var(--surface); color: var(--ink); border-radius: 0.7rem; padding: 0.6rem 1rem 0.75rem; margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.1rem; }
.watch .chan small { font: 700 0.85rem var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.watch .chan b { font: 800 3.2rem/1 var(--font-display); letter-spacing: 0.01em; text-wrap: balance; }
.watch .chan em { font: 700 1.3rem/1.1 var(--font-display); font-style: normal; margin-top: 0.4rem; color: var(--muted); }
.watch .chan.long b { font-size: 2.4rem; line-height: 1.05; }
.watch .note { font-size: 0.95rem; margin-top: 0.5rem; }

.empty { color: var(--muted); }
footer { color: var(--muted); font-size: 0.8rem; border-top: 0.1rem solid var(--line); padding-top: 0.9rem; }
@media (prefers-reduced-motion: no-preference) { .game { transition: border-color .2s; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="bar">
      <div>
        <h1>NBA Game Finder</h1>
        <p class="sub" id="now">Times are Pacific</p>
      </div>
      <div class="size" role="group" aria-label="Text size">
        <span>Text size</span>
        <button type="button" id="smaller" aria-label="Make text smaller">A&minus;</button>
        <button type="button" id="bigger" aria-label="Make text bigger">A+</button>
      </div>
    </div>
    <nav class="days" id="days" aria-label="Pick a day"></nav>
  </header>

  <main id="main" class="wrap" style="gap:1.75rem"></main>

  <footer>
    Schedule, channels and final scores come from ESPN&rsquo;s public feed and refresh through the day.
    Broadcasts can change. Games not on national TV are listed under More games, on Amazon.
  </footer>
</div>

PgogICAgPC9zdmc+"
  };
  // Fallback when a logo is missing: team color and 3-letter code in a round badge.
  var TEAMS = {
    "Atlanta Hawks": ["ATL", "#C8102E"], "Boston Celtics": ["BOS", "#007A33"], "Brooklyn Nets": ["BKN", "#1A1A1A"],
    "Charlotte Hornets": ["CHA", "#00788C"], "Chicago Bulls": ["CHI", "#CE1141"], "Cleveland Cavaliers": ["CLE", "#860038"],
    "Dallas Mavericks": ["DAL", "#00538C"], "Denver Nuggets": ["DEN", "#0E2240"], "Detroit Pistons": ["DET", "#C8102E"],
    "Golden State Warriors": ["GSW", "#1D428A"], "Houston Rockets": ["HOU", "#CE1141"], "Indiana Pacers": ["IND", "#002D62"],
    "LA Clippers": ["LAC", "#C8102E"], "Los Angeles Lakers": ["LAL", "#552583"], "Memphis Grizzlies": ["MEM", "#5D76A9"],
    "Miami Heat": ["MIA", "#98002E"], "Milwaukee Bucks": ["MIL", "#00471B"], "Minnesota Timberwolves": ["MIN", "#236192"],
    "New Orleans Pelicans": ["NOP", "#0C2340"], "New York Knicks": ["NYK", "#006BB6"], "Oklahoma City Thunder": ["OKC", "#007AC1"],
    "Orlando Magic": ["ORL", "#0077C0"], "Philadelphia 76ers": ["PHI", "#006BB6"], "Phoenix Suns": ["PHX", "#E56020"],
    "Portland Trail Blazers": ["POR", "#E03A3E"], "Sacramento Kings": ["SAC", "#5A2D81"], "San Antonio Spurs": ["SAS", "#1D1D1D"],
    "Toronto Raptors": ["TOR", "#CE1141"], "Utah Jazz": ["UTA", "#002B5C"], "Washington Wizards": ["WAS", "#002B5C"]
  };
  function team(name, pts, win) {
    var t = TEAMS[name] || [name.slice(0, 3).toUpperCase(), "#475467"];
    var src = LOGOS[t[0]];
    var mark = src
      ? '<i class="logo" aria-hidden="true"><img src="' + src + '" alt=""></i>'
      : '<i style="background:' + t[1] + '" aria-hidden="true">' + t[0] + "</i>";
    var score = typeof pts === "number" ? '<em class="pts' + (win ? " win" : "") + '">' + pts + "</em>" : "";
    return '<div class="tm">' + mark + "<b>" + esc(name) + "</b>" + score + "</div>";
  }
  function card(g, now) {
    var st = status(g, now), v = SERVICE[g.t], pill = "";
    var sc = st === "done" && typeof g.as === "number" ? { a: g.as, h: g.hs } : null;
    if (st === "live") pill = '<span class="pill live">Live now</span>';
    else if (st === "done") pill = '<span class="pill">' + (sc ? "Final" : "Finished") + "</span>";
    else if (until(g, now)) pill = '<span class="pill">' + until(g, now) + "</span>";
    var watch = st === "done" ? "" :
      '<div class="watch ' + v.cls + '"><span class="lbl">Watch on</span>' +
      (v.warn ? '<span class="warn">' + v.warn + "</span>" : "") +
      '<span class="chan' + (v.svc.length > 12 ? " long" : "") + '"><b>' + v.svc + "</b>" +
      (v.chan !== v.svc ? "<em>Then tap " + v.chan + "</em>" : "") +
      "</span>" + (g.n || v.note ? '<span class="note">' + esc(g.n || v.note) + "</span>" : "") + "</div>";
    return '<article class="game ' + st + '"><div class="head"><span class="time">' + timeFmt.format(g.ms) +
      "</span>" + pill + '</div><div class="teams">' + team(g.a, sc && sc.a, sc && sc.a > sc.h) + '<span class="at">at</span>' + team(g.h, sc && sc.h, sc && sc.h > sc.a) +
      "</div>" + watch + "</article>";
  }
  function cards(list, now) { return '<div class="cards">' + list.map(function (g) { return card(g, now); }).join("") + "</div>"; }

  var scales = [1, 1.2, 1.45, 1.75, 2.1];
  var idx = 1;
  try { var saved = parseInt(localStorage.getItem("nba-size"), 10); if (saved >= 0 && saved < scales.length) idx = saved; } catch (e) {}
  function applySize() {
    document.documentElement.style.setProperty("--scale", scales[idx]);
    document.getElementById("smaller").disabled = idx === 0;
    document.getElementById("bigger").disabled = idx === scales.length - 1;
    try { localStorage.setItem("nba-size", String(idx)); } catch (e) {}
  }
  document.getElementById("smaller").onclick = function () { if (idx > 0) { idx--; applySize(); } };
  document.getElementById("bigger").onclick = function () { if (idx < scales.length - 1) { idx++; applySize(); } };

  var sel = null;
  document.getElementById("days").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button[data-day]") : null;
    if (!b) return;
    sel = b.getAttribute("data-day");
    render();
  });

  function render() {
    var now = Date.now();
    document.getElementById("now").textContent = nowFmt.format(now) + " · Pacific time";
    var todayKey = dayKeyFmt.format(now);
    var tomorrowKey = dayKeyFmt.format(now + 86400000);

    // Days that have games, today onward (or all of them if every day is past).
    var byDay = {}, keys = [];
    GAMES.forEach(function (g) {
      var k = dayKeyFmt.format(g.ms);
      if (!byDay[k]) { byDay[k] = []; keys.push(k); }
      byDay[k].push(g);
    });
    var lastKey = dayKeyFmt.format(now + 7 * 86400000);
    var upcoming = keys.filter(function (k) { return k >= todayKey && k <= lastKey; });
    if (upcoming.length) keys = upcoming;
    if (sel === null || keys.indexOf(sel) < 0) sel = keys.indexOf(todayKey) >= 0 ? todayKey : keys[0];

    document.getElementById("days").innerHTML = keys.map(function (k) {
      var first = byDay[k][0].ms, n = byDay[k].length;
      var w = k === todayKey ? "Today" : k === tomorrowKey ? "Tomorrow" : wkShortFmt.format(first);
      return '<button type="button" data-day="' + k + '" aria-pressed="' + (k === sel) + '"><span class="w">' + w +
        '</span><span class="d">' + dtShortFmt.format(first) + '</span><span class="c">' + n + (n === 1 ? " game" : " games") + "</span></button>";
    }).join("");

    var html = "";
    var live = sel === todayKey ? GAMES.filter(function (g) { return status(g, now) === "live"; }) : [];
    if (live.length) {
      html += '<section class="day livesec"><h2><span>On right now</span></h2>' + cards(live, now) + "</section>";
    }
    var list = byDay[sel].filter(function (g) { return live.indexOf(g) < 0; });
    var tag = sel === todayKey ? "Today" : sel === tomorrowKey ? "Tomorrow" : "";
    var first = byDay[sel][0].ms;
    var label = tag
      ? "<span>" + tag + '</span><span class="dt">' + dayLabelFmt.format(first) + "</span>"
      : "<span>" + wkFmt.format(first) + '</span><span class="dt">' + dtFmt.format(first) + "</span>";
    var main = list.filter(function (g) { return g.t !== "lp"; });
    var extra = list.filter(function (g) { return g.t === "lp"; });
    if (list.length || !live.length) {
      html += '<section class="day"><h2>' + label + "</h2>";
      if (PARTIAL[sel]) html += '<p class="partial">' + PARTIAL[sel] + "</p>";
      if (main.length) html += cards(main, now);
      if (!main.length && !extra.length) html += '<p class="empty">No games.</p>';
      if (extra.length) {
        html += "<h3>More games<span>Amazon</span></h3>" + cards(extra, now);
      }
      html += "</section>";
    }
    document.getElementById("main").innerHTML = html;
  }

  function normTeam(name) { return name === "Los Angeles Clippers" ? "LA Clippers" : name; }

  // Replace the built-in games with data/schedule.json (built by the GitHub Action).
  function applyData(json) {
    if (!json || !json.games || !json.games.length) return false;
    var list = json.games.map(function (g) {
      return prep({ id: g.id, s: g.s, a: g.a, h: g.h, t: g.t, state: g.state, as: g.as, hs: g.hs, n: g.n });
    });
    // In some areas NBC shows only one of two same-night NBC games, and we can't tell which.
    // Both get the red-and-black "NBC or Peacock" card until the data file says otherwise.
    var perDay = {};
    list.forEach(function (g) {
      if (g.t === "nbc") { var k = dayKeyFmt.format(g.ms); (perDay[k] = perDay[k] || []).push(g); }
    });
    Object.keys(perDay).forEach(function (k) {
      if (perDay[k].length === 2) perDay[k].forEach(function (g) { g.t = "nbcpk"; });
    });
    GAMES = list;
    PARTIAL = json.partial || {};
    return true;
  }
  function loadData() {
    return fetch("data/schedule.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (json) { if (applyData(json)) render(); })
      .catch(function () {}); // keep the built-in games
  }

  // Check ESPN directly for game status and final scores while the page is open.
  // If the browser is not allowed to read the feed, nothing changes and the data file is used.
  var etKeyFmt = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" });
  function espnDay(ms) { return etKeyFmt.format(ms).replace(/-/g, ""); }
  function refreshLive() {
    var now = Date.now();
    var days = [espnDay(now - 86400000), espnDay(now), espnDay(now + 86400000)];
    return Promise.all(days.map(function (d) {
      return fetch("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=" + d)
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
    })).then(function (all) {
      var changed = false;
      all.forEach(function (data) {
        (data.events || []).forEach(function (ev) {
          var c = ev.competitions && ev.competitions[0];
          if (!c || !c.competitors) return;
          var home = c.competitors.filter(function (x) { return x.homeAway === "home"; })[0];
          var away = c.competitors.filter(function (x) { return x.homeAway === "away"; })[0];
          if (!home || !away) return;
          var a = normTeam(away.team.displayName), start = Date.parse(ev.date);
          var g = GAMES.filter(function (x) { return x.id === String(ev.id) || (x.ms === start && x.a === a); })[0];
          if (!g) return;
          var st = ev.status && ev.status.type && ev.status.type.state;
          st = st === "in" || st === "post" ? st : "pre";
          var as = Number(away.score), hs = Number(home.score);
          if (g.state !== st) { g.state = st; changed = true; }
          if (st === "post" && isFinite(as) && isFinite(hs) && (g.as !== as || g.hs !== hs)) { g.as = as; g.hs = hs; changed = true; }
        });
      });
      if (changed) render();
    }).catch(function () {});
  }

  applySize();
  render();
  loadData().then(refreshLive);
  setInterval(render, 60000);
  setInterval(function () { if (!document.hidden) refreshLive(); }, 120000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) loadData().then(refreshLive); });
})();

name: Refresh NBA data

on:
  schedule:
    - cron: "0 14 * * *"            # every morning, about 7am Pacific
    - cron: "*/20 0-6,19-23 * * *"  # every 20 minutes through game hours (UTC)
  workflow_dispatch:                # the "Run workflow" button

permissions:
  contents: write

concurrency:
  group: refresh-nba-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build data/schedule.json
        run: node scripts/build-data.mjs
      - name: Commit if the data changed
        run: |
          if [ -z "$(git status --porcelain data/schedule.json)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git commit -m "Refresh NBA schedule and scores"
          git push
